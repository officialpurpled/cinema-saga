<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Saga</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Header Section -->
  <div class="header">
    <div class="left">
      <div class="header-title">
        <i></i>
        CINEMA SAGA
      </div>
    </div>
    <div class="right">
      <nav class="nav-menu">
        <span class="menu-item">
          <a href="" class="home-nav">Home</a>
        </span>
        <span class="menu-item">
          <a href="" class="movie-nav">Movie</a>
        </span>
        <span class="menu-item">
          <a href="" class="cinema-nav">Showtime</a>
        </span>
        <span class="menu-item">
          <a href="" class="contact-nav">Contact</a>
        </span>
      </nav>
      <img src="menu.svg" alt="menu" class="menu-icon">
    </div>
  </div>


  <!-- Home Section -->
  <div class="home-section flex-container" id="home">
    <div class="hero-container">
      <div class="hero-text">
        <h1 class="hero-header">The Magic of the Big Screen Awaits</h1>
        <h3 class="hero-subtext">
          Book tickets for this week's biggest blockbusters and premium immersive experiences.
        </h3>
      </div>

      <button class="cta-btn">BOOK NOW</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
